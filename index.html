<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mesa de Treino de Poker</title>
</head>
<body style="margin:0; background:#0a1410;">
<style>
  #pk-root * { box-sizing: border-box; }
  #pk-root {
    --felt-dark: #0b3d2e;
    --felt: #0f5132;
    --felt-light: #146341;
    --rail: #3a2417;
    --gold: #d4af37;
    --gold-dim: #a3872a;
    --cream: #f7f4ea;
    --ink: #1a1712;
    --red: #b8433d;
    --muted: #cdd8cf;
    --panel: #12241c;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--cream);
    background: radial-gradient(ellipse at center, #1b2a20 0%, #0a1410 100%);
    border-radius: 14px;
    padding: 18px;
    max-width: 980px;
    margin: 0 auto;
    font-size: 16px;
  }
  @media (max-width: 640px){
    #pk-root { padding: 10px; border-radius: 10px; font-size: 17px; }
  }
